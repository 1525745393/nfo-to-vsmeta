# 自动发布：打 v* 标签即触发构建并创建 GitHub Release
# - 正式版本 vX.Y.Z：发布稳定版
# - 预发布版本 vX.Y.Z-rcN（含连字符的 tag）：标记为 Prerelease，用于测试环境
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取全部历史与 tags（发布校验依赖 git tag 查询）

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发布前验证（版本号/CHANGELOG/单元测试/git tag）
        run: python scripts/check_release.py --run-tests --check-tag

      - name: 构建发布包
        run: python scripts/build_release.py

      - name: 读取版本号
        id: version
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: 生成 SHA256 校验和
        run: |
          cd dist
          sha256sum nfo-to-vsmeta-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: 验证发布包可运行（解压 + --version 一致性）
        run: |
          mkdir -p verify && cd verify
          unzip -q ../dist/nfo-to-vsmeta-${{ steps.version.outputs.version }}.zip
          cd nfo-to-vsmeta-${{ steps.version.outputs.version }}
          v="$(python nfo-to-vsmeta.1.0.py --version)"
          echo "包内版本输出: $v"
          test "$v" = "nfo-to-vsmeta ${{ steps.version.outputs.version }}"

      - name: 生成 Release notes（含校验和）
        run: |
          python scripts/build_release.py --notes > notes.md
          printf '\n---\n### 校验和（SHA256）\n\n```\n' >> notes.md
          cat dist/SHA256SUMS >> notes.md
          printf '```\n' >> notes.md

      - name: 创建 GitHub Release 并上传附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          # 预发布 tag（如 v1.3.0-rc1）标记为 Prerelease
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            "dist/nfo-to-vsmeta-${{ steps.version.outputs.version }}.zip" \
            dist/SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            $PRERELEASE
