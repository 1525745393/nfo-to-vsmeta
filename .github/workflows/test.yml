name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: 安装 ruff 与 mypy
        run: pip install ruff mypy
      - name: ruff check
        run: ruff check . --cache-dir .ruff_cache
      - name: ruff format --check
        run: ruff format --check . --cache-dir .ruff_cache
      - name: mypy
        run: mypy --cache-dir .mypy_cache
      - uses: actions/cache@v4
        with:
          path: |
            .ruff_cache
            .mypy_cache
          key: lint-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ hashFiles('pyproject.toml') }}-
            lint-

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 单元测试（含 CLI 退出码冒烟）
        run: python -m unittest discover -s tests
      - name: smoke（--version）
        run: python nfo-to-vsmeta.1.0.py --version

  release-check:
    name: Release Pre-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 发布前验证（版本号/CHANGELOG/单元测试）
        run: python scripts/check_release.py --run-tests

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # 上传 SARIF 结果
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
